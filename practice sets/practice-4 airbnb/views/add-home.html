<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add your house</title>
</head>

<body>
    <header>
        <h1>Register your home</h1>
    </header>
    <main>
        <form action="/add-home" method="POST">
            <label for="houseName">House Name:</label>
            <input type="text" name=houseName placeholder="Enter the name of your house" /><br>

            <label for="address">Address</label>
            <input type="text" name="address" placeholder="Write your address"><br>

            <label for="water">Water Availability:</label>
            <input type="radio" name="water" id="yes">Yes
            <input type="radio" name="water" id="no">No

            <input type="submit" value="submit" />
        </form>
    </main>
</body>

</html>
